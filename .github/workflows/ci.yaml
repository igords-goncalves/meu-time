# https://docs.github.com/en/actions/quickstart
name: Continuous integration
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [pull_request]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
          cache: yarn

      - name: Install Dependencies
        run: rm -rf node_modules && yarn install --frozen-lockfile

      - name: Build
        run: yarn run build

      - name: Create Cypress env file
        env:
          CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL }}
        run: |
          echo "{\"api_key\":\"$CYPRESS_API_URL\"}" > cypress.env.json

      - name: Run Server and Run Tests
        run: |
          yarn preview --host 0.0.0.0 --port 5173 &
          sleep 5
          yarn run cypress:headless
